name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install (CPU-only, matches serverless first-run)
        run: make setup

      - name: Lint
        # TODO: drop continue-on-error once the ~20 pre-existing ruff errors on main
        # are cleaned up in a follow-up PR. Kept non-blocking here so unrelated feature
        # PRs aren't gated on a lint-debt burn-down that predates them.
        continue-on-error: true
        run: make lint

      - name: Test
        run: make test
