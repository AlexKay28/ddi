# DDI-stress synthetic dataset (issue #51) — knob-space documentation.
#
# This is a DATASET-LEVEL documentation config, not a runner config. Runner configs
# (phase2_train_free, etc.) reference `dataset: ddi_stress` and select the task family
# by setting the DDI_STRESS_TASK env var (or by orchestrator-level injection).
#
# The single registered loader `ddi_stress` yields records for one of five task families,
# each targeting a specific DDI claim:
#
#   fact_chain          — C5 (multi-hop failure), C2 (query isolation)
#   fact_aggregation    — C5 (cross-doc aggregation), C1 (parity when separable)
#   contradiction       — C5 (arbitrating between docs), C6 (distractor robustness)
#   coreference         — attention-sink robustness
#   needle              — C4 caching stress + C6 distractor robustness; LitM stand-in
#
# Every knob below lands in each record's `meta` so the report layer can slice by any axis.
# Split sizes: train=600 / val=200 / test=200. Manifest hash committed per family under
# `results/splits/ddi_stress__<family>.json`.
#
# One example per family (documentation only — not consumed by the loader):

task_family_selection:
  env_var: DDI_STRESS_TASK
  default: fact_chain
  choices: [fact_chain, fact_aggregation, contradiction, coreference, needle]

knob_space:
  # Common to all families
  n_docs: 5                       # total documents in info_contexts
  n_gold: null                    # family-defaulted; number of gold docs
  gold_positions: null            # explicit indices for gold docs; sampled if unset
  distractor_strength: far        # "near" | "far" — near shares an entity with gold, far is unrelated
  n_facts_per_doc: 2              # information density inside each doc
  # fact_chain only
  hop_depth: 3                    # 2..6; number of composition hops

examples:
  fact_chain:
    # Answer requires composing hop_depth facts across hop_depth gold docs.
    n_docs: 5
    n_gold: 3                     # equals hop_depth for this family
    hop_depth: 3
    gold_positions: [0, 2, 4]
    distractor_strength: far

  fact_aggregation:
    # N gold docs each carry a partial answer; question requires combining them.
    n_docs: 5
    n_gold: 3
    gold_positions: [1, 2, 4]
    distractor_strength: near
    # aggregation_type is per-record: rotates across {count, list, sum, max}.

  contradiction:
    # Two gold docs disagree; the more-recent date wins.
    n_docs: 5
    n_gold: 2
    gold_positions: [0, 3]
    distractor_strength: far

  coreference:
    # Doc A introduces the entity; doc B refers via pronoun. Question asks the referent.
    n_docs: 5
    n_gold: 2
    gold_positions: [1, 4]
    distractor_strength: far

  needle:
    # Single gold doc among distractors — LitM-style position sweep lives here.
    n_docs: 5
    n_gold: 1
    gold_positions: [2]
    distractor_strength: far
