# Example config. The `task:` key selects the runner (see ddi.cli.register_runner);
# runners define their own schema.
#
# `require_gpu: false` opts out of the CLI's default-on CUDA requirement — every real
# experiment config leaves it unset so a serverless container without a working CUDA
# torch fails at boot rather than silently running for hours on CPU.
task: example_placeholder
model: Qwen/Qwen2.5-7B-Instruct
mask:
  variant: ddi_qf
  bridge_k: null
kernel: sdpa
require_gpu: false
