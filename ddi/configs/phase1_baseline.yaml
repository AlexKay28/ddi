# [1.4] Full-causal baseline for delta computation (issue #12).
#
# Runs the `phase1_full_baseline` runner: per-record answer-only cross-entropy loss
# under the full causal mask plus greedy-generation EM/F1/presence. Writes every
# metric to results/runs.jsonl with provenance. After running across >=3 seeds,
# `ddi-delta` (or `make delta`) fixes `Δ` from the seed-to-seed variance of the
# baseline alone — ground rule 9.

task: phase1_full_baseline
model: Qwen/Qwen2.5-7B-Instruct
dataset: nq
split: val
max_new_tokens: 64
max_records: 100  # smoke run; remove or raise for full-scale baselines
