# [2.3] Bridge-width curve — paper centerpiece (issue #15).
#
# The bridge_k sweep is orchestrated by rendering this config once per K value
# in {1, 2, 4, 8, 16, 32, 64, query_len} and invoking `make sweep-bridge` per
# (K, seed). RESEARCH_PLAN §8 Phase 2.3: one model (Qwen2.5-7B), >=3 seeds.
# F2 (quality vs k) generates from the resulting store rows via
# `make report NAME=F2 OUT=paper/generated/F2.pdf`; F6 (quality/speed Pareto)
# pairs with Phase 3.2 timing rows.
#
# This runs on top of the phase2_train_free runner — the mask variant is
# fixed to ddi_bridge_k here and only bridge_k varies across invocations.

task: phase2_train_free
model: Qwen/Qwen2.5-7B-Instruct
mask:
  variant: ddi_bridge_k
  bridge_k: 4                    # overridden per invocation by the orchestrator
dataset: nq
split: val
max_new_tokens: 64
max_records: 100  # smoke run; remove or raise for full-scale sweeps
