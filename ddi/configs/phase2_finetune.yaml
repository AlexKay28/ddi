# [2.2] Full-SFT fine-tune with the DDI mask present throughout (issue #14).
#
# Runs only when Phase 2.1 (train-free sweep, issue #13) leaves a gap to `full` that
# exceeds `Δ`. Answers the diagnostic question: does the model just need a nudge to
# route through the query region, or is information genuinely destroyed?
#
# Eval of the resulting checkpoint reuses phase2_train_free with `model:` set to the
# checkpoint directory saved by this runner — no separate eval runner exists.

task: phase2_finetune_train
model: Qwen/Qwen2.5-7B-Instruct
dataset: nq
split: train
mask:
  variant: ddi_qf
  bridge_k: null
lr: 1.0e-5
warmup_steps: 50
max_steps: 500                # smoke; real runs will be larger
grad_accum_steps: 8
gradient_checkpointing: true
validate_every: 100
output_dir: checkpoints/phase2_finetune
# TODO: LoRA path (light-adaptation rung of issue #14) — add `mode: lora` and PEFT wiring.
