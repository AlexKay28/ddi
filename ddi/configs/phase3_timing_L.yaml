# [3.3] Document-length sweep vs analytical (issue #19).
#
# Orchestrator invokes with L in {128, 512, 2048} at fixed N=13, Q=64, with >=5
# seeds each. Small L is where FlashAttention varlen should lose to a dense
# kernel (per-block launch overhead dominates); large L is where DDI's realized
# speedup should approach the analytical target — pairing this sweep with the
# N-sweep (phase3_timing_N.yaml) is what separates launch-overhead from
# structural realization gap in Phase 3.5.

task: phase3_timing
model: Qwen/Qwen2.5-7B-Instruct
mask:
  variant: ddi_qf
  bridge_k: null
N: 13
L: 512                         # overridden per invocation by the orchestrator
Q: 64
answer_len: 16
backend: sdpa
n_repeats: 5
warmup: 3
n_new_tokens: 16
