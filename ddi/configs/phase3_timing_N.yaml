# [3.2] Document-count sweep vs analytical (issue #18).
#
# Orchestrator invokes with N in {1, 3, 5, 9, 13, 25} at fixed L=512, Q=64, with
# >=5 seeds each. RESEARCH_PLAN §7 targets (10.59x at N=13, 90.6% sparsity, etc.)
# are attached to each row via `analytical_speedup` and `mask_sparsity`, so
# Phase 3.5 / F3 can plot realization ratio without a separate lookup.
#
# N=1 is the correctness gate — DDI must be numerically identical to full there,
# so the measured speedup must round to 1.00x.

task: phase3_timing
model: Qwen/Qwen2.5-7B-Instruct
mask:
  variant: ddi_qf              # override per invocation for variant sweeps
  bridge_k: null
N: 13                          # overridden per invocation by the orchestrator
L: 512
Q: 64
answer_len: 16
backend: sdpa
n_repeats: 5
warmup: 3
n_new_tokens: 16
