# [4.2] Per-document KV cache correctness — cache hit == cold compute (issue #23).
#
# Runs the `phase4_cache_correctness` runner: for each doc in `info_contexts`, computes its
# KV block twice from a cold start (determinism) and round-trips it through DocCache
# (persistence). Both properties are needed for a per-document cache to be admissible under
# ground rules 2/3 — the cache lives on disk, keyed deterministically, and its behaviour is
# auditable via the results store.
#
# `layout: restart` is what makes each doc's KV block a pure function of its content and
# therefore cacheable across requests. `layout: sequential` is provided as a control — under
# sequential, positions leak into the KVs and blocks are only reusable at identical retrieval
# positions.
#
# See RESEARCH_PLAN §8 Phase 4.2; issue #1 §4.2 for the acceptance criterion.

task: phase4_cache_correctness
model: Qwen/Qwen2.5-7B-Instruct
mask:
  variant: ddi_qf
  bridge_k: null
layout: restart      # sequential is provided as a control; restart is what unlocks caching
dataset: nq
max_records: 10
cache_dir: cache/doc_kv
