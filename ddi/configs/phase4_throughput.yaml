# [4.4] End-to-end throughput under document reuse — F5 co-headline (issue #25).
#
# Runs the `phase4_throughput` runner: streams `n_requests` RAG-shaped requests over a
# synthetic doc universe with the requested reuse distribution, times each request, and
# writes QPS + hit rate + per-request latency. Three `mode` values compare:
#
#   ddi_cache     — DocCache serves hits; misses pay compute_doc_kv.
#                   (First-pass: hits skip doc prefill rather than injecting cached KVs;
#                    full-injection path is a follow-up.)
#   ddi_recompute — cache is always empty; every doc costs a fresh compute_doc_kv.
#   full_causal   — no per-doc computation; one causal forward on the full prompt.
#                   (Baseline that PagedAttention / prefix caching would compete with.)
#
# Change `mode` per invocation; F5 collates rows across all three modes at report time.
#
# The doc universe is synthetic (deterministic random-token texts) so the QPS number is
# a function of shape and hit rate, not corpus content. Swap-in of a real retrieval
# corpus is a follow-up — this runner is the shape-of-the-curve first pass.
#
# See RESEARCH_PLAN §8 Phase 4.4; issue #1 §4.4; issue #25.

task: phase4_throughput
model: Qwen/Qwen2.5-7B-Instruct
mask:
  variant: ddi_qf
  bridge_k: null
layout: restart
dataset: nq                    # reserved for future real-corpus swap-in; unused today
n_requests: 200
reuse_distribution: zipf       # zipf | uniform | fixed
zipf_a: 1.5                    # larger = more reuse of top docs
top_docs: 32                   # size of the doc universe from which we sample per request
docs_per_request: 5            # N per prompt
warmup_requests: 20
mode: ddi_cache                # ddi_cache | ddi_recompute | full_causal
cache_dir: cache/doc_kv
