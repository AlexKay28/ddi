# [5.3] Cross-document composition probe — the failure envelope (issue #28).
#
# Synthetic task where each record's answer PROVABLY requires composing exactly two
# specific documents (doc_A: "<X> lives in <CITY>."; doc_B: "<CITY> is in <COUNTRY>.").
# The other N-2 documents are distractors that mention none of X, CITY, or COUNTRY.
# Full causal attention lets doc_B attend to doc_A; ddi_qf blocks that and must resolve
# the composition inside the query/answer region. Varying `distance` (distractors between
# the pair) and `pair_position` characterises the boundary of what ddi_qf can recover —
# what issue #28's acceptance calls out as "characterized, not merely observed".
#
# The orchestrator sweeps this file across {full, ddi_qf, ddi_bridge_k} x {sequential,
# restart} x seeds; the probe knobs are per-record and land in the run_id automatically.

task: phase5_composition
model: Qwen/Qwen2.5-7B-Instruct
dataset: composition
mask:
  variant: ddi_qf              # override to full for the baseline arm
  bridge_k: null               # required only when variant == ddi_bridge_k
layout: restart
split: val
max_new_tokens: 32
max_records: 100
