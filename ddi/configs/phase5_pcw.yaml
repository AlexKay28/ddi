# [5.2] Parallel Context Windows baseline — Ratner et al., ACL 2023 (issue #27).
#
# PCW ≈ ddi_qf + restart in our machinery: each doc is its own independent context
# window (block-diagonal on the key/value side), the query attends to every window,
# and per-window RoPE positions restart at 0. This config runs the `phase5_pcw`
# runner, which wraps that combo with the PCW label; kept as a distinct runner so
# store rows separate cleanly from Phase 2/4 sweeps and the paper's PCW column is
# a first-class citizen in results tables.
#
# No mask/layout knobs here: the paper defines the setup, we don't get to vary it.
# NQ / TriviaQA are the datasets PCW reports on (RESEARCH_PLAN §1.1 comparability
# row) — this cell is what makes DDI's C1 quality claim positionable against the
# ACL 2023 literature.
#
# See RESEARCH_PLAN §2 (prior art) and §8 Phase 5.2.

task: phase5_pcw
model: Qwen/Qwen2.5-7B-Instruct
dataset: nq
split: val
max_new_tokens: 64
max_records: 100  # smoke run; remove or raise for full-scale sweeps
