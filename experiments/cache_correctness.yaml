# C4 — cache correctness gate.
#
# Quantifies numerical logit drift between per-document KV reuse and fresh recomputation.
# Behavioral generation equivalence is a separate gate: bf16 paths may emit identical greedy
# tokens without satisfying a strict max-absolute-logit tolerance.
#
# Compares three modes on the same (N, L, query) shape:
#   - ddi_cache      — reuse per-document KV blocks; diff is versus ddi_recompute.
#   - ddi_recompute  — restart DDI, no cache; diff is versus full_causal.
#   - full_causal    — baseline full-causal attention, no cache.
#
# Tracking: C4 rollup issue (pending — see experiments/README.md).
# Schema:   experiments/README.md + issue #81 YAML format section.

kind: cache
seed: 0
task: correctness
modes: [ddi_cache, ddi_recompute, full_causal]
Ns: [3, 9, 25]
Ls: [512]
n_queries_per_doc: 5

# The emitted body is `{model: {mode: {L: {N: value}}}}` -- fixed per kind. The `rows:
# mode` / `cols: N` pair that used to sit here was read by nothing and was also wrong
# (it omitted the L axis entirely).
report:
  tables:
    - kind: correctness
      metric: max_abs_logit_diff
