# C4 — cache throughput (replaces the legacy F5 figure).
#
# Measures QPS on repeated documents under three modes; ddi_cache is expected
# to dominate ddi_recompute (which in turn dominates full_causal) as the per-doc
# KV blocks amortize across queries.
#
# Tracking: C4 rollup issue (pending — see experiments/README.md).
# Schema:   experiments/README.md + issue #81 YAML format section.

kind: cache
seed: 0
task: throughput
modes: [ddi_cache, ddi_recompute, full_causal]

# This file used to declare `Ns: [3, 9, 25]`, `Ls: [512]` and `n_queries_per_doc: 5`, with
# a comment claiming the shape mirrored cache_correctness.yaml. `_cache_throughput` reads
# NONE of those three. It reads the scalars below, and it loops over `modes:` only -- so
# the advertised 3x9x25 grid never existed and every throughput run this file ever
# produced used the runner's built-in defaults for document shape.
#
# The values below ARE those defaults, written down: this config now describes the
# experiment that actually ran, so its rows stay comparable with every row already in the
# store. Nothing here changes what a re-run measures.
top_docs: 32            # size of the synthetic document universe requests draw from
docs_per_request: 5     # documents attached to each request — this is the real "N"
doc_token_len: 500      # tokens per document — this is the real "L"

# Sweeping the document count needs one invocation per point, e.g.
#   python -m ddi.run experiments/cache_throughput.yaml --model <id> --set docs_per_request=9
# because the runner takes a scalar, not a list. Note before you do: `docs_per_request`,
# `doc_token_len` and `top_docs` are NOT in the phase4_throughput run_id, so two such runs
# land in the same aggregator cell and get averaged. Adding them to the run_id
# (ddi/run.py::_cache_throughput) is the prerequisite for a real sweep.

# `rows: mode` / `cols: N` dropped: nothing read them, and `cols: N` was doubly wrong --
# there is no N axis in these rows at all. The body is `{model: {mode: {arm: value}}}`
# where `arm` is `{layout}/reuse={reuse}`, the only axis the run_id actually carries.
report:
  tables:
    - kind: throughput
      metric: qps
