# Immutable VIBEQUEUE-46 replacement checkpoint identity.  Do not reuse this
# output directory or store for later seeds or retries.
kind: finetune
seed: 1
datasets: [hotpot_qa, musique, synthetic_qa]
output_dir: results/checkpoints/Qwen__Qwen2.5-7B-Instruct__ddi_qf__r5b_seed1
output_store: results/finetune_qwen_r5b_seed1.jsonl

# The established bounded diagnostic contract: 20k mixed records leaves about
# 19k after the 5% holdout, or about 4,750 optimizer steps at accumulation 4.
max_records: 20000
held_out_frac: 0.05
holdout_eval_records: 500
epochs: 1
lr: 1.0e-5
kl_temperature: 1.0
grad_accum_steps: 4
warmup_steps: 100
log_every: 50
max_steps: null
num_gpus: 1
trainable_layers: 8

report:
  tables:
    - kind: finetune_loss
    - kind: perplexity
