# Issue #120 — self-distillation fine-tuner, SMOKE-TEST variant.
#
# Same pipeline as experiments/finetune.yaml (teacher=full mask, student=ddi_qf,
# KL-divergence self-distillation) but capped to a quick end-to-end run: small
# record cap, few optimizer steps, short warmup. Used by run_finetune.sh's
# multi-model batch loop to sanity-check that finetuning works for a model
# before committing to a full-dataset run via `make finetune`.
#
# Schema: experiments/README.md + issue #81 YAML format section.

kind: finetune
model: Qwen/Qwen2.5-7B-Instruct
seed: 0
datasets: [hotpot_qa, musique, kilt_nq, synthetic_qa]
output_dir: results/checkpoints/Qwen__Qwen2.5-7B-Instruct__ddi_qf__seed0
max_records: 1000       # smoke cap; see experiments/finetune.yaml for the full-run (null) version
held_out_frac: 0.05
epochs: 1
lr: 1.0e-5
kl_temperature: 1.0
grad_accum_steps: 4
warmup_steps: 10        # short warmup matched to the 50-step smoke cap below
log_every: 50
max_steps: 50           # stop after 50 optimizer steps for a quick end-to-end check

report:
  tables:
    - kind: finetune_loss    # renderer TBD (see #120 follow-ups)
    - kind: perplexity       # renderer TBD (see #120 follow-ups)
