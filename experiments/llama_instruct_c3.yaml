# C3 — timing grid for Llama-3.1-8B-Instruct.
#
# Mirror of qwen_instruct_c3.yaml, different model. Same 108-cell shape.
#
# Tracking: https://github.com/AlexKay28/ddi/issues/75
# Schema:   experiments/README.md + issue #81 YAML format section.

kind: timing
model: meta-llama/Llama-3.1-8B-Instruct
seed: 0
Ns: [1, 3, 5, 9, 13, 25]
Ls: [128, 512, 2048]
backends: [sdpa, fa2]
masks: [full, ddi_qf, blind]
n_repeats: 5
warmup: 3
metrics: [ttft, tpot, sparsity, analytical, realized, realization]

report:
  tables:
    - kind: timing
      rows: mask
      cols: N
      metric: ttft
      split_by: [L, backend]
    - kind: timing
      rows: mask
      cols: N
      metric: tpot
      split_by: [L, backend]
    - kind: timing
      rows: mask
      cols: N
      metric: sparsity
      split_by: [L, backend]
    - kind: timing
      rows: mask
      cols: N
      metric: analytical
      split_by: [L, backend]
    - kind: timing
      rows: mask
      cols: N
      metric: realized
      split_by: [L, backend]
    - kind: timing
      rows: mask
      cols: N
      metric: realization
      split_by: [L, backend]
