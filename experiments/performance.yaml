# C3 — timing grid.
#
# Model-agnostic: run once per model with `make exp-c3 MODEL=<hf-id>`. On `main` this
# is exercised against Qwen2.5-7B-Instruct (tracking: #74) and Llama-3.1-8B-Instruct
# (tracking: #75) — same 108-cell shape either way.
#
# 3 masks x 6 Ns x 3 Ls x 2 backends = 108 cells. One table per timing metric,
# split into blocks by (L, backend) so each block is a clean rows=mask, cols=N grid.
#
# fa2 cells may fail on machines without flash-attn (blocked by #70); the runner
# annotates rather than aborting.
#
# Schema: experiments/README.md + issue #81 YAML format section.

kind: timing
seed: 0
Ns: [1, 3, 5, 9, 13, 25]
Ls: [128, 512, 2048]
backends: [sdpa, fa2]
masks: [full, ddi_qf, blind]
n_repeats: 5
warmup: 3
metrics: [ttft, tpot, sparsity, analytical, realized, realization]

report:
  tables:
    - kind: timing
      rows: mask
      cols: N
      metric: ttft
      split_by: [L, backend]
    - kind: timing
      rows: mask
      cols: N
      metric: tpot
      split_by: [L, backend]
    - kind: timing
      rows: mask
      cols: N
      metric: sparsity
      split_by: [L, backend]
    - kind: timing
      rows: mask
      cols: N
      metric: analytical
      split_by: [L, backend]
    - kind: timing
      rows: mask
      cols: N
      metric: realized
      split_by: [L, backend]
    - kind: timing
      rows: mask
      cols: N
      metric: realization
      split_by: [L, backend]
