# C1 — quality parity across the four direct QA datasets.
#
# Model-agnostic: run once per model with `make exp-c1 MODEL=<hf-id>`. On `main` this
# is exercised against Qwen2.5-7B-Instruct (tracking: #74) and Llama-3.1-8B-Instruct
# (tracking: #75) — same axes, same margin `Δ`, different model each invocation.
#
# ``nq`` was dropped in #105: it is degenerate (no docs), the aggregator silently drops
# every row, and the runner wastes ~300 record-passes on it per sweep.
#
# Schema: experiments/README.md + issue #81 YAML format section.

kind: quality
seed: 0
datasets: [hotpot_qa, musique, kilt_nq, synthetic_qa]
masks: [full, ddi_qf, blind]
max_records: 100
max_new_tokens: 64
metrics: [em, f1, presence, loss]

# Optional: evaluate a locally saved checkpoint (issue #120 self-distillation
# artefacts land here) instead of the HF-hub ``model`` above. When set,
# ``model`` is still recorded in provenance so downstream readers know which
# base architecture the checkpoint was trained from.
# checkpoint: results/checkpoints/Qwen__Qwen2.5-7B-Instruct__ddi_qf__seed0

report:
  tables:
    - kind: quality
      rows: mask
      cols: dataset
      metric: em
    - kind: quality
      rows: mask
      cols: dataset
      metric: f1
    - kind: quality
      rows: mask
      cols: dataset
      metric: presence
    - kind: quality
      rows: mask
      cols: dataset
      metric: loss
