# C1 — quality parity across the four direct QA datasets.
#
# Model-agnostic: run once per model with `make exp-c1 MODEL=<hf-id>`. On `main` this
# is exercised against Qwen2.5-7B-Instruct (tracking: #74) and Llama-3.1-8B-Instruct
# (tracking: #75) — same axes, same margin `Δ`, different model each invocation.
#
# ``nq`` was dropped in #105: it is degenerate (no docs), the aggregator silently drops
# every row, and the runner wastes ~300 record-passes on it per sweep.
#
# Schema: experiments/README.md + issue #81 YAML format section.

kind: quality
seed: 0
# kilt_nq is NOT in this list, and its absence is load-bearing. Its documents were
# Wikipedia titles rather than passages (harness review R1), so the loader now raises
# rather than fabricating them -- including on the cached path, because every existing
# kilt_nq cache was written by the pre-review loader. Leaving it here therefore does not
# produce a weak dataset, it aborts the whole run at the third dataset. Restoring it
# needs the KILT knowledge-source join first.
datasets: [hotpot_qa, musique, synthetic_qa]
masks: [full, ddi_qf, blind]
max_records: 100
max_new_tokens: 64
metrics: [em, f1, presence, loss]

# Freeze the exact validation IDs on first controlled run, then retain and reuse these
# manifest files for every comparison. Persist one prediction/result JSON object per example.
heldout_manifest: results/heldout
predictions_store: results/quality_predictions.jsonl

# Optional: evaluate a locally saved checkpoint (issue #120 self-distillation
# artefacts land here) instead of the HF-hub ``model`` above. When set,
# ``model`` is still recorded in provenance so downstream readers know which
# base architecture the checkpoint was trained from.
# checkpoint: results/checkpoints/Qwen__Qwen2.5-7B-Instruct__ddi_qf__seed0

# `rows:` / `cols:` used to appear on every table below. Nothing read them: the JSON body
# is `{model: {mask: {dataset: value}}}` by construction, so the axes are fixed per kind
# and the keys only ever described a markdown renderer that no longer exists.
report:
  tables:
    - kind: quality
      metric: em
    - kind: quality
      metric: f1
    - kind: quality
      metric: presence
    - kind: quality
      metric: loss
