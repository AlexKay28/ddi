[project]
name = "ddi"
version = "0.0.0"
description = "Decoupled Document Inference — block-diagonal attention over retrieved documents for cheaper RAG prefill."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    # ddi/model.py now carries BOTH masking APIs (issue #30, done):
    #   <4.53  — per-model `_update_causal_mask`, patched per instance in patch_model().
    #   >=4.53 — module-level `masking_utils.create_causal_mask`, hooked once at import.
    # The >=4.53 path is the LIVE one: every published DDI number was produced by GPU jobs
    # running transformers 5.14.1, which the old `<4.53` ceiling excluded outright — the pin
    # described a configuration nobody runs, so `uv sync` could not reproduce a published
    # result. The ceiling is therefore raised to the next major (<6), which is where the
    # masking API could plausibly move again. The 4.44 floor stays: it is the oldest version
    # whose `_update_causal_mask` signature the <4.53 patch assumes.
    "transformers>=4.44,<6",
    "datasets>=2.14",
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
# triton is a hard runtime dep of fa2, not just the (deferred) triton backend: transformers'
# flash_attention integration unconditionally imports flash_attn.ops.triton.rotary, so
# `import transformers` itself breaks without it once flash-attn is installed.
fa2 = ["flash-attn>=2.6", "triton>=3.0"]
triton = ["triton>=3.0"]
# bitsandbytes is a 41 MB CUDA-oriented wheel used in exactly one place: the AdamW8bit
# branch of ddi/finetune.py, which only runs on `device.type == "cuda"`. As a hard
# dependency it made `import ddi.finetune` — and therefore tests/test_finetune.py —
# unusable on any CPU-only host. Install it when you actually train: `--extra train`.
train = ["bitsandbytes>=0.50.0"]
report = ["pandas", "matplotlib"]
dev = ["pytest", "pytest-cov", "ruff"]

[project.scripts]
ddi-run = "ddi.run:main"
ddi-aggregate = "ddi.aggregate:main"
ddi-delta = "ddi.delta_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ddi", "ddi.data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gate: correctness gate that must pass before any DDI number is admitted (issue #4, ground rule 6)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Pin torch to a cu121 build — this box's driver (535.129.03, CUDA 12.2 max) can't run the
# +cu130 wheel the default PyPI index resolves to for an unpinned `torch>=2.4` (issue #31).
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
